<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">Demand Growth for AI</title>
<desc id="desc">An unchanged upward-sloping supply curve intersects initial demand at E1 and higher demand at E2. Price increases from P1 to P2, and quantity increases from Q1 to Q2.</desc>
<defs>
<marker id="ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#172437"/></marker>
<marker id="note" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#46596e"/></marker>
<marker id="demand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#225789"/></marker>
<marker id="supply" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#a33439"/></marker>
</defs>
<rect width="960" height="680" fill="white"/>
<text x="56" y="66" font-size="36" fill="#172437" font-weight="700" text-anchor="start">Demand Growth for AI</text>
<text x="57" y="101" font-size="19" fill="#46596e" font-weight="400" text-anchor="start">An outward demand shift raises equilibrium price and quantity</text>
